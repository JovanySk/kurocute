# KuroCute: entorno local completo (PHP 8.5 + MySQL 8.4 + Mailpit + build de assets)
# Uso: docker compose up -d   ->  http://localhost:8000  (correo: http://localhost:8025)
name: kurocute

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: kurocute-app:dev
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kurocute
      DB_USERNAME: kurocute
      DB_PASSWORD: kurocute
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      assets:
        condition: service_completed_successfully

  assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kurocute
      MYSQL_USER: kurocute
      MYSQL_PASSWORD: kurocute
      MYSQL_ROOT_PASSWORD: kurocute-root
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukurocute", "-pkurocute"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  vendor:
  node_modules:
  mysql:
